<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free App / Website Demo — Misbah Digital</title>
<meta name="description" content="Apne business ke liye free app/website demo. Form bharo, Misbah Digital contact karega.">
<meta property="og:title" content="Apne business ka FREE app demo"><meta property="og:description" content="Cafe, salon, gym, coaching, shop — 2 minute mein form bharo">
<meta property="og:image" content="img/icon-512.png"><meta name="theme-color" content="#F1EEE7">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1E1E1C;background:#F1EEE7;display:grid;place-items:center;padding:22px}
.box{width:min(460px,100%);background:#FBFAF6;border:1px solid #EAE6DC;border-radius:24px;padding:34px 28px;box-shadow:0 2px 4px rgba(40,36,24,.05),0 14px 34px rgba(40,36,24,.09);animation:up .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
img{width:56px;height:56px;border-radius:50%}h1{margin:16px 0 6px;font:500 34px/1.1 "Cormorant Garamond",Georgia,serif}p{color:#5C5B55;margin:0 0 20px}
label{display:block;margin-bottom:16px;font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#8D8B82}
input,textarea,select{width:100%;margin-top:8px;padding:13px 16px;border-radius:14px;border:1px solid #E2DDD1;background:#FFFEFA;color:#1E1E1C;font:15px Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;outline:0;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:#5E6350;box-shadow:0 0 0 4px rgba(94,99,80,.14)}
button{width:100%;padding:15px;border:0;border-radius:999px;background:#1E1E1C;color:#F6F3EC;font-weight:500;font-size:15px;cursor:pointer;transition:transform .25s}
button:hover{transform:translateY(-1px)}
button[disabled]{opacity:.6}.hp{position:absolute;left:-9999px}.msg{margin-top:12px;font-size:14px;min-height:20px}.ok{color:#5E7A4E}.bad{color:#A3523F}
.perks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.perks span{font-size:11.5px;padding:5px 12px;border-radius:20px;background:#E4E4D6;color:#4A4E3F}
.f{font-size:12px;color:#8D8B82;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main class="box">
  <img src="img/icon-192.png" alt="Misbah Digital">
  <h1>Apne business ka FREE app demo</h1>
  <p>Cafe, bakery, salon, gym, coaching, dukaan — customer phone pe menu dekhe aur seedha WhatsApp pe order/booking kare.</p>
  <div class="perks"><span>Mobile app jaisa</span><span>WhatsApp order</span><span>1 din mein ready</span></div>
  <form id="f">
    <label>Aapka naam *<input name="name" required maxlength="80" autocomplete="name" placeholder="Jaise: Rahul"></label>
    <label>Mobile / WhatsApp *<input name="phone" required inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="10 digit"></label>
    <label>Business ka naam<input name="business" maxlength="100" placeholder="Jaise: Royal Bakers, Govindpur"></label>
    <label>Kya chahiye?<textarea name="msg" rows="3" maxlength="600" placeholder="App / website / Insta reels…"></textarea></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="b">Free demo maango →</button>
    <div class="msg" id="m" role="status"></div>
  </form>
  <div class="f">Made by Misbah Digital · Govindpur, Dhanbad</div>
</main>
<script>
const W = "https://misbah-digital-computer.misbahbuilds123.workers.dev";
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault(); const b = document.getElementById("b"), m = document.getElementById("m");
  const d = Object.fromEntries(new FormData(e.target)); d.source = new URLSearchParams(location.search).get("src") || "lead-form";
  if (String(d.phone).replace(/\D/g, "").length < 10) { m.className = "msg bad"; m.textContent = "10 digit mobile number daalo"; return; }
  b.disabled = true; m.className = "msg"; m.textContent = "Bhej rahe hain…";
  try { const r = await fetch(W + "/api/public/lead", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(d) }); const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Error"); m.className = "msg ok"; m.textContent = (j.message || "Shukriya!"); e.target.reset(); }
  catch (err) { m.className = "msg bad"; m.textContent = err.message; }
  b.disabled = false;
};
</script>
</body>
</html>

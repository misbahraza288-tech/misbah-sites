<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<title>Misbah HQ</title>
<link rel="stylesheet" href="hq.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg></span><div><b>Misbah HQ</b><small>QENLYX · AI team</small></div></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">—</span></div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="app" tabindex="-1"><section class="card login" id="login" hidden>
  <h1>Misbah HQ</h1><p class="mut">Dashboard key daalo (wahi DASHBOARD_KEY jo Misbah Digital Computer dashboard me hai). Key sirf is phone ke browser me rehti hai.</p>
  <form id="loginForm"><label for="key" class="sr">Dashboard key</label><input id="key" type="password" autocomplete="current-password" placeholder="DASHBOARD_KEY" required><button class="btn primary" type="submit">Kholo</button></form>
  <p class="err" id="loginErr" role="alert"></p>
</section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer class="foot">Misbah HQ · numbers sirf asli confirm payments ke. Kamai ki koi guarantee nahi. Client ke phone number yahan kabhi nahi dikhte.</footer>
<script src="config.js"></script>
<script src="hq.js"></script>
</body>
</html>

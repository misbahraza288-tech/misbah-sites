<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<title>Baat karein — Misbah Raza / QENLYX</title>
<style>
:root{--bg:#0b0d10;--p:#12151a;--p2:#171b21;--l:#232830;--ink:#eef1f5;--m:#8b94a3;--a:#d6b56c;--ok:#5fc59a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px;border-bottom:1px solid var(--l)}header b{display:block;font-size:17px}header small{color:var(--m)}
.ai{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--a);border:1px solid rgba(214,181,108,.45);border-radius:999px;padding:3px 9px;margin-top:8px}
.offer{margin:12px 16px 0;padding:14px;border:1px solid var(--l);border-radius:14px;background:var(--p)}.offer h2{margin:0 0 6px;font-size:14px}.offer ul{margin:6px 0;padding-left:18px;color:#cfd5de;font-size:13px}
.price{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--m)}.price b{color:var(--ink);font-size:16px}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--l);background:var(--p2);color:var(--ink);border-radius:10px;padding:9px 13px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn.a{background:var(--a);color:#15120a;border-color:var(--a)}.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.log{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;white-space:pre-line;font-size:14px}.msg.c{align-self:flex-end;background:#25303d}.msg.a{align-self:flex-start;background:var(--p);border:1px solid var(--l)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}.chips button{flex:none;border:1px solid var(--l);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px}
form{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--l);position:sticky;bottom:0;background:var(--bg)}
textarea{flex:1;resize:none;height:44px;background:var(--p2);color:var(--ink);border:1px solid var(--l);border-radius:10px;padding:10px;font:inherit}
.deal{border:1px solid rgba(95,197,154,.5);background:rgba(95,197,154,.07);border-radius:14px;padding:12px;margin:0 16px 10px}
.err{color:#e46a6a;padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <header><b id="title">Misbah Raza · QENLYX</b><small id="sub">Website · Order app · Reels</small><br>
    <span class="ai"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Aap AI assistant se baat kar rahe hain — final baat Misbah khud confirm karte hain</span></header>
  <div id="offer"></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div id="deal"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><label for="t" style="position:absolute;left:-9999px">Message</label><textarea id="t" placeholder="Apna sawaal likhiye…" maxlength="600"></textarea><button class="btn a" type="submit" aria-label="Bhejo"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg></button></form>
</div>
<script>
(function(){
  var W="https://misbah-digital-computer.misbahbuilds123.workers.dev";
  var q=new URLSearchParams(location.search),L=q.get("l")||"",T=q.get("t")||"";
  var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var rs=function(n){return "₹"+Number(n||0).toLocaleString("en-IN")};
  var K="hqtalk_"+L,H=[];try{H=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
  function add(r,t){H.push({r:r,t:t});localStorage.setItem(K,JSON.stringify(H.slice(-40)));draw()}
  function draw(){$("#log").innerHTML=H.map(function(m){return '<div class="msg '+m.r+'">'+esc(m.t)+'</div>'}).join("");window.scrollTo(0,document.body.scrollHeight)}
  function fail(m){$("#log").innerHTML='<div class="err">'+esc(m)+'</div>';$("#f").style.display="none"}
  if(!L||!T){fail("Link adhoora hai. Misbah se naya link maangiye.");return}
  fetch(W+"/api/hq/talk?l="+encodeURIComponent(L)+"&t="+encodeURIComponent(T)).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){fail(d.error||"Link kaam nahi kar raha");return}
    $("#title").textContent=d.name+" ke liye — "+d.by+" · "+d.brand;$("#sub").textContent=d.area||"";
    $("#offer").innerHTML='<div class="offer"><h2>'+esc(d.service)+'</h2><ul>'+d.scope.map(function(s){return "<li>"+esc(s)+"</li>"}).join("")+'</ul><div class="price"><span>Estimate<br><b>'+rs(d.price)+'</b></span><span>Advance (50%)<br><b>'+rs(d.advance)+'</b></span><span>Time<br><b>~'+d.delivery_days+' din</b></span></div>'+(d.demo_url?'<p style="margin:10px 0 0"><a class="btn" href="'+esc(d.demo_url)+'">Aapka demo dekhiye</a></p>':'')+'</div>';
    if(!H.length)add("a","Namaste 🙏 Main Misbah Raza ka AI assistant hoon. "+d.name+" ke liye jo demo bana hai uske baare mein kuch bhi poochiye — price, time, kya-kya milega.");else draw();
    $("#chips").innerHTML=["Kya-kya milega?","Kitne din lagenge?","Price thoda kam hoga?","Haan, karte hain"].map(function(c){return "<button type=button>"+c+"</button>"}).join("");
  }).catch(function(){fail("Network problem — thodi der baad try kariye.")});
  $("#chips").addEventListener("click",function(e){if(e.target.tagName==="BUTTON"){$("#t").value=e.target.textContent;send()}});
  $("#f").addEventListener("submit",function(e){e.preventDefault();send()});
  var busy=false;
  function send(){var t=$("#t").value.trim();if(!t||busy)return;busy=true;$("#t").value="";add("c",t);add("a","…");
    fetch(W+"/api/hq/talk",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({l:L,t:T,msg:t,history:H.slice(-12)})}).then(function(r){return r.json()}).then(function(d){
      H.pop();add("a",d.ok?d.reply:(d.error||"Abhi jawab nahi de pa raha 🙏"));
      if(d.deal){$("#deal").innerHTML='<div class="deal"><b>Order summary</b><br>Price: '+rs(d.deal.price)+' · Advance (50%): '+rs(d.deal.advance)+'<br>'+(d.pay_url?'<a class="btn a" style="margin-top:8px" href="'+esc(d.pay_url)+'">Advance pay karein (UPI)</a>':'Misbah aapko payment details WhatsApp pe bhejenge.')+'<br><small style="color:#8b94a3">Payment ke baad screenshot Misbah ko WhatsApp karein. Misbah confirm karke kaam shuru karenge.</small></div>'}
    }).catch(function(){H.pop();add("a","Network problem — dobara bhejiye.")}).then(function(){busy=false})}
})();
</script>
</body>
</html>
